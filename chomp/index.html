<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neon Chomp</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <canvas id="game" aria-label="Neon Chomp game"></canvas>

  <!-- Title-screen menu. The canvas draws the logo and parade above it. -->
  <div id="menu" class="menu" hidden>
    <button type="button" class="play" id="play">Play <kbd>Enter</kbd></button>
    <p class="hint" id="controls-hint">Arrows / WASD move · Space dash · P pause · M sound</p>

    <section>
      <h2 id="difficulty-label">Difficulty</h2>
      <div class="segmented" role="radiogroup" aria-labelledby="difficulty-label" id="difficulty"></div>
      <p class="hint" id="difficulty-hint"></p>
    </section>
    <label class="toggle sound"><input type="checkbox" id="sound"> Sound effects</label>
    <p class="hint" id="menu-high" hidden></p>

    <details id="customise">
      <summary>Customise colours <span class="summary-dot" id="summary-dot"></span></summary>
      <div class="customise">
        <canvas id="preview" aria-label="Preview of your character"></canvas>
        <div class="colour-rows">
          <section>
            <h2 id="body-label">Body</h2>
            <div class="swatches" id="body-swatches" role="radiogroup" aria-labelledby="body-label"></div>
          </section>
          <section>
            <h2>
              <span id="glow-label">Glow</span>
              <label class="toggle"><input type="checkbox" id="glow-match"> match body</label>
            </h2>
            <div class="swatches" id="glow-swatches" role="radiogroup" aria-labelledby="glow-label"></div>
          </section>
        </div>
      </div>
      <p class="warning" id="clash" hidden></p>
    </details>
    <a class="back" href="../">← Arcade</a>
  </div>

  <script type="module" src="../src/chomp/main.js"></script>
</body>
</html>
